manifest_version: 1
name: browserpaw
version: '5.0.0'
description: 'BrowserPaw Chrome browser automation plugin for Hermes Agent, bundling the canonical Agent Skill and a unified browserpaw CLI tool with gateway media delivery.'
author: GoldenLoaf24h
license: AGPL-3.0
homepage: https://github.com/GoldenLoaf24h/browserpaw
provides_tools:
  - browserpaw
provides_hooks: []
requires_env: []
requires_hermes: '>=0.21.5'

config_schema:
  cli_path:
    type: string
    default: ''
    description: 'Optional absolute path to the browserpaw CLI executable (defaults to searching PATH)'
  timeout_seconds:
    type: number
    default: 120
    description: 'Maximum execution time in seconds for a single browserpaw CLI invocation (5-600)'
