name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Run extension unit tests
        run: pnpm --filter chrome-mcp-server test -- --run

      - name: Run native server unit tests
        run: pnpm --filter mcp-chrome-bridge test

      - name: Run scripts regression tests
        run: node --test scripts/*.test.mjs scripts/*.test.cjs

      - name: Run simulated CDP in-memory mock integration suite
        run: node --experimental-strip-types test/e2e/runner.ts