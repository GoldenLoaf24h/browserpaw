name: CI

on:
  push:
    branches: [main, 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated skill mirrors
        run: node scripts/sync-skills.mjs --check

      - name: Check release notes specification
        run: pnpm release:check

      - name: Run complete acceptance gate
        run: pnpm verify

      - name: Install Chrome for Testing
        if: runner.os == 'Linux'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify CLI on a loaded extension
        if: runner.os == 'Linux'
        env:
          BROWSERPAW_TEST_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a pnpm test:e2e

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-${{ matrix.os }}
          path: |
            .artifacts/verification/
            .artifacts/cli-live/
          if-no-files-found: warn
